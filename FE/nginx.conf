server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router dung client-side routing - route nao khong khop file
    # tinh thi fallback ve index.html, khong thi F5 vao /repair-settlement
    # se bi nginx tra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

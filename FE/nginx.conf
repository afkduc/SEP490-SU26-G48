server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # He thong quan ly noi bo (CRM, React SPA cua chinh container "fe") - dat
    # duoi "/crm", dat truoc "location /" de duoc uu tien khop. File tinh nam
    # o "<root>/crm/" (xem Dockerfile), Vite da build voi base "/crm/" (xem
    # vite.config.js) nen index.html tu tham chieu dung "/crm/assets/...".
    # Route nao khong khop file tinh thi fallback ve /crm/index.html (React
    # Router dung client-side routing) - khong thi F5 vao /crm/repair-settlement
    # se bi nginx tra 404.
    location /crm {
        try_files $uri $uri/ /crm/index.html;
    }

    # URL CRM bi mat prefix /crm (bookmark / History API cu) → 301 ve /crm/...
    # Vi du: /admin/users?roleId=2 → /crm/admin/users?roleId=2 (tranh 404 Landing).
    location ^~ /admin {
        return 301 /crm$request_uri;
    }
    location = /login {
        return 301 /crm/login;
    }
    location ^~ /login/ {
        return 301 /crm$request_uri;
    }
    location = /unauthorized {
        return 301 /crm/unauthorized;
    }
    location ^~ /manager {
        return 301 /crm$request_uri;
    }
    location ^~ /inventory {
        return 301 /crm$request_uri;
    }
    location ^~ /repair {
        return 301 /crm$request_uri;
    }
    location ^~ /technician {
        return 301 /crm$request_uri;
    }
    location ^~ /customer {
        return 301 /crm$request_uri;
    }
    location ^~ /profile {
        return 301 /crm$request_uri;
    }
    location ^~ /team-leader {
        return 301 /crm$request_uri;
    }
    location ^~ /warehouse {
        return 301 /crm$request_uri;
    }
    location ^~ /cashier {
        return 301 /crm$request_uri;
    }
    location ^~ /receptionist {
        return 301 /crm$request_uri;
    }

    # Landing page (Next.js, container rieng "landing") - gio chiem GOC domain
    # (basePath rong, xem Landing/next.config.mjs) thay vi "/gioi-thieu" nhu
    # truoc, vi day la trang khach hang thay dau tien khi vao autogara.site.
    # proxy_pass KHONG duoc co phan path (chi "http://landing:3000") de nginx
    # giu nguyen URI goc khi chuyen tiep.
    location / {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

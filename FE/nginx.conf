server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Landing page (Next.js, container rieng "landing") - dat truoc "location /"
    # de duoc uu tien khop. "^~" + khong co dau "/" o cuoi prefix nen khop ca
    # "/gioi-thieu" (trang chu, vi Next basePath khong tu them dau / cuoi) lan
    # "/gioi-thieu/tra-cuu", "/gioi-thieu/_next/...". proxy_pass KHONG duoc co
    # phan path (chi "http://landing:3000") de nginx giu nguyen URI goc khi
    # chuyen tiep - Next dang tu doi tat ca route/asset theo dung basePath do.
    location ^~ /gioi-thieu {
        proxy_pass http://landing:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router dung client-side routing - route nao khong khop file
    # tinh thi fallback ve index.html, khong thi F5 vao /repair-settlement
    # se bi nginx tra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
